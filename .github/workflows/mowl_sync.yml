name: MOWL to Garmin sync

on:
  workflow_dispatch:
  push:
    branches: [mowl-actions-migration]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: mowl-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'schedule' || vars.MOWL_CLOUD_READY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GARMIN_USER: ${{ secrets.GARMIN_USER }}
      GARMIN_PASS: ${{ secrets.GARMIN_PASS }}
      GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
      STRAVA_SESSION_COOKIES: ${{ secrets.MOWL_STRAVA_SESSION }}
      MOWL_STATE_KEY: ${{ secrets.MOWL_STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      MOWL_START_AFTER: ${{ vars.MOWL_SYNC_AFTER }}
      MOWL_STRAVA_MARKER: MOWL
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore Strava session
        run: |
          set -euo pipefail
          test -n "$STRAVA_SESSION_COOKIES"
          mkdir -p outputs
          umask 077
          session_file="$(mktemp)"
          trap 'rm -f "$session_file"' EXIT
          printf '%s' "$STRAVA_SESSION_COOKIES" > "$session_file"
          python scripts/strava_browser_cookies.py restore outputs/strava-browser-profile "$session_file"
      - name: Verify encrypted journal
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import logging, os, sys
          from pathlib import Path
          from cloud_sync_state import CloudState
          logging.disable(logging.CRITICAL)
          try:
              state = CloudState('outputs/mowl-sync', os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'], os.environ['MOWL_STATE_KEY'])
              state.restore()
              os.environ['GARMINTOKENS'] = str(Path('outputs/mowl-sync/garmin-tokens').resolve())
              from garmin_connect import get_api
              get_api()
              state.checkpoint()
          except Exception:
              print('Could not verify the encrypted journal or Garmin session.')
              sys.exit(1)
          print('Encrypted journal and Garmin session verified.')
          PYCODE
      - name: Run synchronization
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            test -n "$MOWL_STATE_KEY"
            test -n "$MOWL_START_AFTER"
            export MOWL_CLOUD_STATE=1
            export GARMINTOKENS="$GITHUB_WORKSPACE/outputs/mowl-sync/garmin-tokens"
            python mowl_sync.py --days 7 --settle-minutes 30 --after "$MOWL_START_AFTER" --apply > "$RUNNER_TEMP/mowl-sync.log" 2>&1 || { echo "Synchronization failed; original activities are retained when verification fails."; exit 1; }
          else
            test -n "$GARMIN_TOKENS_JSON"
            token_dir="$(mktemp -d)"
            trap 'rm -rf "$token_dir"' EXIT
            umask 077
            printf '%s' "$GARMIN_TOKENS_JSON" > "$token_dir/garmin_tokens.json"
            export GARMINTOKENS="$token_dir"
            python mowl_sync.py --days 2 > "$RUNNER_TEMP/mowl-sync.log" 2>&1 || { echo "Dry run failed; check the Strava and Garmin sessions."; exit 1; }
          fi
